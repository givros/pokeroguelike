<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#172f32" />
    <title>PokéRogue — The Guardian Trail</title>
    <link rel="icon" href="assets/artwork/1.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main id="app" aria-label="PokéRogue">
      <div class="loading-viewport loading-screen">
        <div class="title-shade"></div>
        <div class="loading-brand"><h1>POKÉROGUE</h1><p>THE GUARDIAN TRAIL</p></div>
        <section class="loading-paper paper-panel">
          <img class="loading-emblem" src="assets/generated/guardian-crest.webp" alt="">
          <div class="loading-copy"><h2>Preparing the trail</h2><p>Preparing your journey.</p>
            <div class="health-frame loading-meter" data-loading-progress role="progressbar" aria-label="Preparing artwork" aria-valuemin="0" aria-valuemax="1" aria-valuenow="0"><div class="health-fill" style="width:0%"></div></div>
            <p class="loading-count">Preparing your camp…</p>
          </div>
        </section>
      </div>
    </main>
    <noscript>Enable JavaScript to play.</noscript>
    <script type="module" src="script.js"></script>
  </body>
</html>
